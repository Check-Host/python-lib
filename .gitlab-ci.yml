# Sync to github.com/Check-Host/python-lib is handled by a GitLab native
# push mirror (Settings -> Repository -> Mirroring repositories), not by a
# CI job. The mirror runs server-side on every push and is independent of
# this pipeline.

stages:
  - lint
  - test
  - build
  - publish

default:
  image: python:3.12-slim
  before_script:
    - pip install --upgrade pip

lint:
  stage: lint
  script:
    - pip install -e ".[dev]"
    - ruff check .
    - ruff format --check .
    - mypy checkhost
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install -e ".[dev]"
    - pytest -m "not live" --cov=checkhost --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Primary publish path is github.com/Check-Host/python-lib's Trusted
# Publishing workflow (.github/workflows/publish.yml). It triggers when the
# GitLab native push mirror replicates a `v*` tag to GitHub. No PyPI token
# is stored anywhere - PyPI verifies the GitHub Action via OIDC.
#
# The job below is a fallback for publishing directly from GitLab CI. It
# needs a CI/CD variable PYPI_TOKEN (PyPI API token, scope "Project:
# check-host-api"). Disable it once Trusted Publishing is wired up.
publish_pypi:
  stage: publish
  script:
    - pip install build twine
    - python -m build
    - twine upload --non-interactive -u __token__ -p "$PYPI_TOKEN" dist/*
  rules:
    - if: $CI_COMMIT_TAG && $PYPI_TOKEN
