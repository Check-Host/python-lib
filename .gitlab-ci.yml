# Sync to github.com/Check-Host/python-lib is handled by a GitLab native
# push mirror, not by a CI job.

stages:
  - lint
  - test
  - build
  - publish

default:
  image: python:3.12-slim

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PIP_NO_INPUT: "1"

lint:
  stage: lint
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - ruff check .
    - ruff format --check .
    - mypy checkhost
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  image: python:$PYTHON_VERSION-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - pytest -m "not live" --cov=checkhost --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  script:
    - python -m pip install --upgrade pip build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Publishes to PyPI via the masked CI variable PYPI_TOKEN (project-scoped
# API token for check-host-api). Triggers on every annotated tag matching
# /^v[0-9]+\.[0-9]+\.[0-9]+/, and only when the token is actually set so
# feature branches and unconfigured forks never accidentally try to
# upload. `--skip-existing` makes the job idempotent on tag re-pushes.
publish_pypi:
  stage: publish
  script:
    - python -m pip install --upgrade pip build twine
    - python -m build
    - twine check dist/*
    - twine upload --non-interactive --skip-existing -u __token__ -p "$PYPI_TOKEN" dist/*
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/ && $PYPI_TOKEN
