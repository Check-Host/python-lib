# Sync to github.com/Check-Host/python-lib is handled by a GitLab native
# push mirror (Settings -> Repository -> Mirroring repositories), not by a
# CI job. The mirror runs server-side on every push and is independent of
# this pipeline.
#
# The project runner ("Check-Host-Master") uses the shell executor on a
# host that does not have Python preinstalled, so each job creates an
# isolated venv via the system python3 first. The `image:` keyword is
# intentionally absent because shell executors ignore it.

stages:
  - lint
  - test
  - build
  - publish

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

.python_setup: &python_setup
  - python3 --version
  - python3 -m venv .venv
  - . .venv/bin/activate
  - python -m pip install --upgrade pip wheel

lint:
  stage: lint
  script:
    - *python_setup
    - pip install -e ".[dev]"
    - ruff check .
    - ruff format --check .
    - mypy checkhost
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: test
  script:
    - *python_setup
    - pip install -e ".[dev]"
    - pytest -m "not live" --cov=checkhost --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  stage: build
  script:
    - *python_setup
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Publishes to PyPI via the masked CI variable PYPI_TOKEN (project-scoped
# API token for check-host-api). Triggers on every annotated tag matching
# the semver pattern, and only when the token is actually set so feature
# branches and unconfigured forks never accidentally try to upload.
#
# To switch to Trusted Publishing later: configure a pending publisher on
# pypi.org pointing at this GitLab project, then drop the PYPI_TOKEN
# variable and swap the script for `id-token`-based OIDC.
publish_pypi:
  stage: publish
  script:
    - *python_setup
    - pip install --upgrade build twine
    - python -m build
    - twine check dist/*
    - twine upload --non-interactive -u __token__ -p "$PYPI_TOKEN" dist/*
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/ && $PYPI_TOKEN
